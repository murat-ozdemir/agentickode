# docker-compose.bimetri.yml — bimetri yamasi: pgvector'lu Postgres + mem0 (ortak hafiza).
#
# Diger compose dosyalarinin USTUNE eklenir (dev-1):
#   docker compose -p agentickode -f docker-compose.dev.yml -f docker-compose.prod.yml \
#     -f docker-compose.swag.yml -f docker-compose.bimetri.yml up -d
#
# - postgres: ayni ana surum (16), pgvector eklentili imaj. Veri yeni volume'da
#   (agentickode-app_pgvdata); eski alpine volume'u (agentickode-app_pgdata) geri donus icin
#   kalir. Gecis: scripts/bimetri/migrate-to-pgvector.sh (dump/restore; alpine -> debian
#   siralama farki yuzunden volume dogrudan tasinmaz).
# - mem0: resmi sunucu, v2.2.1 etiketinden derlenir. Gizli degerler .env.mem0'da
#   (POSTGRES_PASSWORD, OPENAI_API_KEY, ADMIN_API_KEY, JWT_SECRET); ornek: .env.mem0.example.
#   Vektorler "mem0" DB'sinde, kullanici/anahtar kayitlari "mem0_app" DB'sinde.

services:
  backend:
    environment:
      # Kosu basinda proje hafizasi; MEM0_API_KEY .env'de (bossa ozellik kapali).
      MEM0_URL: ${MEM0_URL:-http://mem0:8000}

  postgres:
    image: pgvector/pgvector:pg16
    volumes:
      - pgvdata:/var/lib/postgresql/data

  mem0:
    build:
      context: https://github.com/mem0ai/mem0.git#v2.2.1:server
    image: bimetri-mem0:v2.2.1
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    env_file:
      - path: .env.mem0
        required: true
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mem0
      POSTGRES_USER: mem0
      POSTGRES_COLLECTION_NAME: memories
      APP_DB_NAME: mem0_app
      HISTORY_DB_PATH: /app/history/history.db
      AUTH_DISABLED: "false"
      MEM0_TELEMETRY: "false"
      # CORS: the dashboard's browser calls the API directly.
      DASHBOARD_URL: http://${MEM0_BIND:-127.0.0.1}:8891
    volumes:
      - mem0history:/app/history
    ports:
      # Ajan makineleri (MCP) icin LAN'a acilir; dev-1'de MEM0_BIND=192.168.20.50 (.env).
      # 8888 degil: dev-1'de tinyproxy orada.
      - "${MEM0_BIND:-127.0.0.1}:8890:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # mem0's own web dashboard, LAN only (not behind SWAG: its Bearer JWT header clashes with
  # the crew basic auth). Log in with the mem0 admin created by scripts/bimetri/mem0-backend-key.sh.
  mem0-dashboard:
    build:
      # Upstream Dockerfile minus the "evaluation" submodule; see docker/mem0-dashboard/Dockerfile.
      context: docker/mem0-dashboard
      additional_contexts:
        upstream: https://github.com/mem0ai/mem0.git#v2.2.1:server/dashboard
    image: bimetri-mem0-dashboard:v2.2.1
    environment:
      # Baked into the browser bundle at container start; must be reachable from the browser.
      NEXT_PUBLIC_API_URL: http://${MEM0_BIND:-127.0.0.1}:8890
      NEXT_PUBLIC_INSTANCE_NAME: bimetri
      API_INTERNAL_URL: http://mem0:8000
      # Without it the refresh cookie is marked Secure (NODE_ENV=production) and the browser
      # drops it over plain HTTP, so every login bounces back to /login.
      DASHBOARD_URL: http://${MEM0_BIND:-127.0.0.1}:8891
    ports:
      - "${MEM0_BIND:-127.0.0.1}:8891:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mem0:
        condition: service_healthy
    restart: unless-stopped

  # Project-memory MCP for the agents (search, list, propose); see
  # backend/mcp/bimetri_memory_server.py. Same image and DB as the backend, but no docker.sock,
  # no SSH keys and read-only code. Needs BIMETRI_MEMORY_MCP_TOKEN in .env (refuses all without).
  memory-mcp:
    build:
      context: .
      dockerfile: Dockerfile.backend.dev
    command: uvicorn backend.mcp.bimetri_memory_server:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://agentickode:agentickode@postgres:5432/agentickode
      MEM0_URL: ${MEM0_URL:-http://mem0:8000}
    volumes:
      - ./backend:/app/backend:ro
    ports:
      - "${MEM0_BIND:-127.0.0.1}:8892:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      mem0:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgvdata:
    name: agentickode-app_pgvdata
  mem0history:
    name: agentickode-app_mem0history
